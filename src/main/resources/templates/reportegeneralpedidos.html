<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

<div th:replace="fragmentos/navegacionadmin :: nav()"></div>

<main class="contenedor">
    <h1>Historial de pedidos realizados</h1>
    <p>Aquí podés ver los pedidos realizados por todos los clientes.</p>

    <div class="cuadro">
        <table class="tabla">
            <tr>
                <th>N.º de pedido</th>
                <th>Usuario</th>
                <th>Fecha</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Cambiar estado</th>
            </tr>
            <tr>
                <td>Pedido 1</td>
                <td>Usuario</td>
                <td>Fecha</td>
                <td>Producto 1</td>
                <td>Cantidad</td>
                <td>Total</td>
                <td>Estado</td>
                <td>
                    <select>
                        <option>Nuevo</option>
                        <option>En preparación</option>
                        <option>Entregado</option>
                    </select>
                    <button type="submit" class="boton">Guardar</button>
                </td>
            </tr>
        </table>
    </div>

</main>

</body>
</html>
