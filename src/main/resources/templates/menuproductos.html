<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú de productos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

<div th:replace="fragmentos/navegacionusuario :: nav()"></div>

<main class="contenedor">
    <h1>Menú de productos</h1>
    <p>Estos son los productos disponibles en el negocio.</p>

    <div class="cuadro" id="lista_productos">
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/manzana.svg}" alt="banano">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/banano.svg}" alt="manzana roja">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/refresco_cola.svg}" alt="Refresco de cola">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/jugo_naranja.svg}" alt="Jugo de naranja en caja">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/botella_agua.svg}" alt="Botella de agua">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/cafe_frio.svg}" alt="Café frio en lata/botella">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/papas.svg}" alt="Papas tostadas">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/galletas.svg}" alt="Galletas dulces rellenas">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/barra_chocolate.svg}" alt="Barra de chocolate">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/sopa_instantanea.svg}" alt="Sopa instantanea en vaso">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/pan_cuadrado.svg}" alt="Pan cuadrado/bollio de pan">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/leche.svg}" alt="Leche en caja 1L">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/huevo.svg}" alt="Huevo">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/atun.svg}" alt="Atun en lata">

        </div>
        <div class="cuadro_pequeno">
            <img th:src="@{/iconos/helado.svg}" alt="Helado de paleta">

        </div>
    </div>
</main>

</body>
</html>
